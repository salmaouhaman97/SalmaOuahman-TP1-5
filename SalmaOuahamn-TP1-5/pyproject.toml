[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment_app"
version = "0.6.0"
description = "Application de classification de sentiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy<2",
  "pandas>=2.2,<3",
  "scikit-learn==1.5.*",
  "joblib==1.4.*",
  "fastapi==0.115.*",
  "uvicorn==0.30.*",
  "pydantic==2.9.*",
  "httpx==0.27.*",
  "streamlit==1.39.*",
  "requests==2.32.*",
  "python-dotenv==1.0.*",
]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools]
packages = ["sentiment_app", "api", "ui"]
