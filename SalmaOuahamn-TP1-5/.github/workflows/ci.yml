name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Installer les dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e . "pytest==8.3.*" "shap==0.46.*"
      - name: Entraîner le modèle de démonstration
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py
      - name: Lancer les tests
        run: |
          . .venv/bin/activate
          pytest -v
      - name: Construire et installer la roue dans un environnement neuf
        run: |
          . .venv/bin/activate
          rm -rf dist
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from zipfile import ZipFile

          wheel = "dist/sentiment_app-0.6.0-py3-none-any.whl"
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          forbidden = ("tests/", "data/", "models/")
          assert not any(name.startswith(forbidden) for name in names), names
          PY
          python -m venv /tmp/sentiment-wheel-env
          /tmp/sentiment-wheel-env/bin/python -m pip install dist/sentiment_app-0.6.0-py3-none-any.whl
          export SENTIMENT_MODELE="$GITHUB_WORKSPACE/models/sentiment.joblib"
          /tmp/sentiment-wheel-env/bin/sentiment --version
          /tmp/sentiment-wheel-env/bin/sentiment predict "Livraison rapide, très satisfait"
          /tmp/sentiment-wheel-env/bin/sentiment serve --help
          /tmp/sentiment-wheel-env/bin/sentiment ui --help
